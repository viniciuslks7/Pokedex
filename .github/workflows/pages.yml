name: Publish Pokédex

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate application
        run: |
          node --version
          node --test tests/rules.test.mjs
          for file in js/*.js scripts/*.cjs; do node --check "$file"; done
          node --check sw.js
          git diff --check
      - name: Build public site
        run: node scripts/build-site.cjs
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pokedex-browser" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/pokedex-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test navigation and interactions
        run: NODE_PATH="$RUNNER_TEMP/pokedex-browser/node_modules" node scripts/test-browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-test-results
          path: test-results
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v5
